name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contrast:
    name: Contrast CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run contrast tests
        run: node scripts/contrast.test.mjs
